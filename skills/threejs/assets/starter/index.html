<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"spin","type":"number","label":"Scene - turns over the clip","default":0.55,"min":-2,"max":2,"step":0.05},{"id":"keyColor","type":"color","label":"Light - key colour","default":"#ffd9b0"},{"id":"roughness","type":"number","label":"Material - roughness","default":0.45,"min":0.05,"max":1,"step":0.01}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Three.js starter - HyperFrames</title>
    <!-- Pin the exact version: an unpinned CDN URL renders differently next month. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0d1014;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #scene-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- data-no-timeline: this composition registers no GSAP timeline, so the
         runtime would otherwise poll for one on every render. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
      data-no-timeline
    >
      <canvas
        id="scene-canvas"
        class="clip"
        data-start="0"
        data-duration="6"
        data-track-index="1"
      ></canvas>
    </div>
    <script type="module" src="assets/render.js"></script>
  </body>
</html>
